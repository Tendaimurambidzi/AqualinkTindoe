<svg width="350" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Accent line -->
  <rect x="0" y="0" width="4" height="100%" fill="#00d9ff"/>

  <!-- Name -->
  <text x="20" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    Your Name
  </text>

  <!-- Title -->
  <text x="20" y="80" font-family="Arial, sans-serif" font-size="14" fill="#00d9ff">
    Software Engineer
  </text>

  <!-- Divider -->
  <line x1="20" y1="100" x2="330" y2="100" stroke="#333" stroke-width="1"/>

  <!-- Contact Info -->
  <text x="20" y="130" font-family="Arial, sans-serif" font-size="11" fill="#cccccc">
    your.email@example.com
  </text>
  <text x="20" y="150" font-family="Arial, sans-serif" font-size="11" fill="#cccccc">
    +1 (555) 123-4567
  </text>
  <text x="20" y="170" font-family="Arial, sans-serif" font-size="11" fill="#cccccc">
    linkedin.com/in/yourprofile
  </text>

  <!-- Website/Company -->
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="end">
    www.yourwebsite.com
  </text>
</svg>