buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Do not fail the whole build on lint in library modules (common RN release blocker)
subprojects { sub ->
    sub.plugins.withId("com.android.library") {
        sub.android {
            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }
    }
}

// After `clean`, native prefab outputs can be missing while CMake configure runs (Gradle ordering gap).
gradle.projectsEvaluated {
    def worklets = rootProject.findProject(":react-native-worklets")
    def reanimated = rootProject.findProject(":react-native-reanimated")
    def visionCamera = rootProject.findProject(":react-native-vision-camera")
    def appProject = rootProject.findProject(":app")

    if (worklets != null && reanimated != null) {
        def workletsPrefab = worklets.tasks.findByName("prefabReleasePackage")
        if (workletsPrefab != null) {
            reanimated.tasks.matching { it.name.startsWith("configureCMakeRelWithDebInfo") }.configureEach { t ->
                t.dependsOn(workletsPrefab)
            }
        }
    }

    if (appProject != null) {
        def prefabTasks = [worklets, reanimated, visionCamera]
            .findAll { it != null }
            .collect { it.tasks.findByName("prefabReleasePackage") }
            .findAll { it != null }
        if (!prefabTasks.isEmpty()) {
            appProject.tasks.matching { it.name.startsWith("configureCMakeRelWithDebInfo") }.configureEach { t ->
                prefabTasks.each { pkg -> t.dependsOn(pkg) }
            }
        }
    }
}
